version: '3.8'

services:
  # 1. MySQL Relational Database Service
  mysql:
    image: mysql:8.0
    container_name: gimbalflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gimbalflow_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # 2. Redis In-Memory Data Store & Queue
  redis:
    image: redis:7-alpine
    container_name: gimbalflow_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Unified Python FastAPI Backend (API Gateway, Admin, Auth, Database, & ML Engine)
  python-backend:
    build: ./python-server
    container_name: gimbalflow_python_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=gimbalflow_db
      - MYSQL_PORT=3306
    depends_on:
      - redis
      - mysql

volumes:
  mysql_data:
